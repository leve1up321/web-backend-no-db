<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="logoGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C084FC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A855F7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(2, 4)">
    <!-- Background -->
    <rect width="32" height="32" rx="6" fill="white" stroke="url(#logoGradient1)" stroke-width="1"/>
    
    <!-- Main geometric pattern -->
    <path d="M16 4L24 8L24 16L20 20L16 16L12 20L8 16L8 8L16 4Z" fill="url(#logoGradient1)" opacity="0.9"/>
    
    <!-- Inner elements -->
    <path d="M16 8L20 12L16 16L12 12L16 8Z" fill="url(#logoGradient2)"/>
    
    <!-- UP representation -->
    <rect x="13" y="18" width="6" height="8" rx="1" fill="url(#logoGradient1)" opacity="0.8"/>
    
    <!-- Side accents -->
    <path d="M6 12L10 8L10 12L6 16L6 12Z" fill="url(#logoGradient2)" opacity="0.7"/>
    <path d="M26 12L22 8L22 12L26 16L26 12Z" fill="url(#logoGradient2)" opacity="0.7"/>
    
    <!-- Central highlight -->
    <circle cx="16" cy="14" r="2" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Text -->
  <text x="42" y="16" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#textGradient)">لفل اب</text>
  <text x="42" y="30" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="url(#textGradient)" opacity="0.8">ستور</text>
</svg>
