    <!-- Right Circle (Orange) -->
    <circle cx="45" cy="17.5" r="15" fill="#F79E1B"/>
    <!-- Intersection -->
    <path d="M30 7.5C33.5 10.5 35.5 14.5 35.5 17.5C35.5 20.5 33.5 24.5 30 27.5C26.5 24.5 24.5 20.5 24.5 17.5C24.5 14.5 26.5 10.5 30 7.5Z" fill="#FF5F00"/>
