<svg width="120" height="75" viewBox="0 0 120 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="75" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- ADCB Card Background -->
  <rect x="15" y="20" width="90" height="35" rx="6" fill="#0066CC"/>
  
  <!-- ADCB Logo -->
  <g transform="translate(25, 30)">
    <!-- ADCB Text -->
    <text x="0" y="12" fill="white" font-family="Arial, sans-serif" font-size="14" font-weight="bold">ADCB</text>
    
    <!-- Bank Symbol -->
    <g transform="translate(45, 2)">
      <circle cx="8" cy="8" r="6" fill="none" stroke="white" stroke-width="1.5"/>
      <path d="M5 8L7 10L11 6" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  
  <!-- Security Chip -->
  <rect x="25" y="45" width="8" height="6" rx="1" fill="#FFD700"/>
  
  <!-- Card Number Placeholder -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="5" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="10" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="15" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
  </g>
  
  <!-- Bank Name -->
  <text x="60" y="65" text-anchor="middle" fill="#0066CC" font-family="Arial, sans-serif" font-size="6" font-weight="normal">Abu Dhabi Commercial Bank</text>
</svg>

