<svg width="120" height="75" viewBox="0 0 120 75" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="120" height="75" rx="12" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Emirates NBD Card Background -->
  <rect x="15" y="20" width="90" height="35" rx="6" fill="#C41E3A"/>
  
  <!-- Emirates NBD Logo -->
  <g transform="translate(25, 30)">
    <!-- Emirates Text -->
    <text x="0" y="8" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">Emirates</text>
    <text x="0" y="18" fill="white" font-family="Arial, sans-serif" font-size="8" font-weight="bold">NBD</text>
    
    <!-- Bank Symbol -->
    <g transform="translate(50, 2)">
      <rect x="0" y="0" width="20" height="2" fill="white"/>
      <rect x="2" y="3" width="2" height="10" fill="white"/>
      <rect x="6" y="3" width="2" height="10" fill="white"/>
      <rect x="10" y="3" width="2" height="10" fill="white"/>
      <rect x="14" y="3" width="2" height="10" fill="white"/>
      <rect x="0" y="14" width="20" height="2" fill="white"/>
    </g>
  </g>
  
  <!-- Security Chip -->
  <rect x="25" y="45" width="8" height="6" rx="1" fill="#FFD700"/>
  
  <!-- Card Number Placeholder -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="5" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="10" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
    <rect x="15" y="0" width="3" height="2" rx="0.5" fill="rgba(255,255,255,0.7)"/>
  </g>
</svg>

